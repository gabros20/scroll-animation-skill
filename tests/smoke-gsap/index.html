<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scroll-animation smoke (gsap)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../skills/scroll-animation/assets/css/animation.css">
<link rel="stylesheet" href="../../skills/scroll-animation/assets/css/animation.gsap.css">
<link rel="stylesheet" href="../../skills/scroll-animation/assets/css/scene.css">
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; color: #eee; font-family: system-ui, sans-serif; }

  /* The fluid scale at fluid-design's defaults, so the distance check below
     has a unit to scale by (this skill does not ship the scale itself). */
  :root { --fluid: 1px; }
  @media (width >= 1024px) {
    :root { --fluid: calc(max(580px, min(calc(100svh * 1000 / 900), calc(100vw * 1000 / 1440))) / 1000); }
  }
  /* Scaled travel, fluid-interop.md §3: pattern 1 (CSS multiplies --scene-p)
     and pattern 2 (a GSAP function value). Both must end 240 drawn px along. */
  #travel { position: relative; height: 200vh; }
  .travel { position: sticky; top: 0; width: 40px; height: 40px; background: #c33; }
  #travel-var { translate: calc(var(--scene-p) * 240 * var(--fluid, 1px)) 0; }
</style>
</head>
<body>

  <div data-stage="mount" style="padding: 40px;">
    <p data-stage-item data-variant="liftFade">Triggered entrance smoke test</p>
  </div>

  <div style="padding: 40px; font-size: 32px;">
    Count: <span data-count-up="42">42</span>
  </div>

  <div data-fade-on-exit style="padding: 40px;">
    <p>Fades out as it scrolls above the viewport.</p>
  </div>

  <div data-scene-root style="height: 300vh;">
    <div data-scene-pin>
      <video
        data-scene-media
        muted
        playsinline
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
        aria-hidden="true"
        data-src="/clip.mp4"
      ></video>
    </div>
    <div data-scene-content>
      <section style="height: 100vh;"></section>
      <section style="height: 100vh;"></section>
      <section style="height: 100vh;"></section>
    </div>
  </div>

  <section id="travel" data-verify-distance="240">
    <div id="travel-var" class="travel"></div>
    <div id="travel-fn" class="travel"></div>
    <div id="fold-canary" class="travel" style="translate: calc(10 * var(--fluid, 1px)) 0"></div>
  </section>

  <!-- Stand-in for a fluid-design limit's registered mirror (fluid-interop.md
       §3, `fluidPx`'s `el`): a real fluid-grow-until scope writes
       --_fluid-m-ui as a calc() off --fluid-ui, but a literal length reads
       identically through getComputedStyle, so this needs no fluid-design
       stylesheet. main.ts reads it with `el` and window.__fluidPxScoped. -->
  <style>@property --_fluid-m-ui { syntax: '<length>'; inherits: false; initial-value: 0px; }</style>
  <div id="fluid-el-scope" style="--_fluid-m-ui: 500px; display: none;"><span id="fluid-el-child"></span></div>

  <div style="height: 50vh;"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
