<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scroll-animation smoke (gsap)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../scroll-animation/assets/motion-base.css">
<link rel="stylesheet" href="../../scroll-animation/assets/gsap/motion.css">
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0c; color: #eee; font-family: system-ui, sans-serif; }
  [data-scrub-video] { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

  <div data-stage="mount" style="padding: 40px;">
    <p data-stage-item data-variant="liftFade">Triggered entrance smoke test</p>
  </div>

  <div style="padding: 40px; font-size: 32px;">
    Count: <span data-count-up="42">42</span>
  </div>

  <div data-fade-on-exit style="padding: 40px;">
    <p>Fades out as it scrolls above the viewport.</p>
  </div>

  <div data-scrub-stage style="height: 300vh; position: relative;">
    <div data-scrub-pin>
      <video
        data-scrub-video
        muted
        playsinline
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
        aria-hidden="true"
        data-src="/clip.mp4"
      ></video>
    </div>
    <div data-scrub-content>
      <section style="height: 100vh;"></section>
      <section style="height: 100vh;"></section>
      <section style="height: 100vh;"></section>
    </div>
  </div>

  <div style="height: 50vh;"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
