<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>render-bridge fixture (markup only)</title>
    <link rel="stylesheet" href="../../../skills/scroll-animation/assets/css/animation.css" />
    <link rel="stylesheet" href="../../../skills/scroll-animation/assets/css/scene.css" />
    <link rel="stylesheet" href="./src/page.css" />
  </head>
  <body>
    <!-- The scene as a server sends it: the poster, then the canvas slot (here an opaque stand-in for a live canvas),
         so the CSS alone decides which one a reader sees: without JavaScript, under reduced motion and in print, the
         poster. No script on this page. -->
    <div id="intro"><h1>render-bridge: markup only</h1></div>
    <div data-scene-root="">
      <div data-scene-pin="">
        <img
          data-scene-poster=""
          class="poster"
          width="1000"
          height="600"
          alt=""
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600'%3E%3Crect width='1000' height='600' fill='%232a6f4e'/%3E%3C/svg%3E"
        />
        <div data-scene-canvas=""><div class="live-stand-in"></div></div>
      </div>
      <div data-scene-content="">
        <section class="act"><h2>Act 1</h2></section>
        <section class="act"><h2>Act 2</h2></section>
        <section class="act"><h2>Act 3</h2></section>
        <section class="act"><h2>Act 4</h2></section>
      </div>
    </div>
    <div id="outro"></div>
  </body>
</html>
