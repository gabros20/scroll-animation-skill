<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>loop-video seam fixture (gsap)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      .spacer {
        height: 150vh;
      }
      .video-wrap {
        position: relative;
        width: 480px;
        height: 270px;
        margin: 0 auto;
      }
      .video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tail {
        height: 150vh;
      }
    </style>
  </head>
  <body>
    <!--
      Task 21: the seam-wrap check needs a REAL seam (loopFromFrame/fps), unlike
      gsap.html which stays in native-loop mode for the task-12 checks. The clip
      is the shared 60-frame/30fps all-intra testsrc plus one spare clone of its
      last frame (61 frames, as `media loop --loop-from` makes it); frame 45 is an arbitrary
      mid-clip seam (loop body = frames 45-59, 15 frames = 0.5s/cycle), not a
      measured pixel match — this fixture asserts frame INDICES and event
      timing, never visual seamlessness.
    -->
    <div class="spacer" id="top"></div>
    <div class="video-wrap">
      <video
        id="fx-video"
        data-loop-video
        muted
        playsinline
        preload="none"
        poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7"
        disablepictureinpicture
        disableremoteplayback
        aria-hidden="true"
        data-loop-from-frame="45"
        data-fps="30"
      >
        <source src="/clip-seam.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="tail"></div>
    <script type="module" src="./src/gsap-seam-entry.ts"></script>
  </body>
</html>
