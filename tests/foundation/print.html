<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>foundation: print</title>
    <!--gate-script-->
    <link rel="stylesheet" href="../../skills/scroll-animation/assets/css/animation.css" />
    <link rel="stylesheet" href="../../skills/scroll-animation/assets/css/scene.css" />
    <link rel="stylesheet" href="./src/page.css" />
    <style>
      html[data-animation='on'] [data-reveal-item] {
        opacity: 0;
        transform: translateY(24px);
      }
    </style>
  </head>
  <body>
    <p data-reveal-item id="gated">An entrance item the engine has not revealed yet.</p>
    <p data-reveal-item id="inline" style="opacity: 0; transform: translateY(24px)">
      An entrance item hidden by an inline style.
    </p>
    <!-- A pinned scene whose pin geometry is inline (ScrollTrigger writes some): the print rules must beat it. -->
    <div data-scene-root style="position: relative; height: 300vh">
      <div data-scene-pin style="position: sticky; top: 0; height: 100lvh; overflow: clip">
        <div style="height: 100%; background: #ccd">The held frame</div>
      </div>
      <div data-scene-content style="margin-top: -100lvh">
        <section style="height: 100vh">Act one</section>
        <div data-scene-spacer style="height: 100vh"></div>
        <section style="height: 100vh">Act two</section>
      </div>
    </div>
    <script type="module" src="./src/print.ts"></script>
  </body>
</html>
