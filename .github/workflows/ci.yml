name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Types for every engine, the audit self-test and the GSAP smoke page in a
  # real browser (the smoke builds a test clip with ffmpeg). The skill-family
  # gate (scripts/check-sync) is check-sync.yml's alone.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Real-browser suites: the foundation (drivers in one tick, authority stamps, anchors, the pre-JS gate and
  # failsafe, print) in Chromium and WebKit, the scene traces against the recorded v1 baseline, and the Folio
  # example through a production Next build on its published media: per-route scroll authority, and every scene's
  # states, reduced motion (no pin, no video bytes) and playhead.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run pretest
      - run: npm run test:foundation
      - run: npm run test:traces
      - run: pnpm install --frozen-lockfile
        working-directory: examples/folio
      # The media-v1 release, SHA-256-checked by the fetch; cached on the manifest that pins it.
      - id: media-cache
        uses: actions/cache@v4
        with:
          path: examples/folio/public/media
          key: folio-media-${{ hashFiles('examples/folio/media/manifest.sha256') }}
      - run: pnpm media
        if: steps.media-cache.outputs.cache-hit != 'true'
        working-directory: examples/folio
      - run: pnpm build
        working-directory: examples/folio
      - run: pnpm exec playwright install chromium webkit
        working-directory: examples/folio
      - run: pnpm check:authority
        working-directory: examples/folio
      - run: pnpm verify:scenes
        working-directory: examples/folio

  # The media blocks in Chromium and WebKit: FrameSequence (decode window, density cap, a scene's band), LoopVideo
  # (pause control, seam wrap, alt, reduced motion, Save-Data) and ScrubVideo (no video under reduced motion,
  # Save-Data, the loop cap).
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg webp
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run pretest
      - run: npm run test:sequence
      - run: npm run test:loop-video
      - run: npm run test:scrub-video
