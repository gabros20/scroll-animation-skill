name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Types for every engine, the audit self-test and the GSAP smoke page in a
  # real browser (the smoke builds a test clip with ffmpeg). The skill-family
  # gate (scripts/check-sync) is check-sync.yml's alone.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
